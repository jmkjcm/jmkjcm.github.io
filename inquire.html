  <script>
  const CONTACT_TG = 'https://t.me/AJSAASJ';
  const CONTACT_WECHAT = 'The666TH';
  let inquireItems = [];

  function tr(key, vars) {
    return (window.CryptoMallI18n && CryptoMallI18n.t) ? CryptoMallI18n.t(key, vars) : (typeof vars === 'string' ? vars : key);
  }
  function pn(item) {
    if (!item) return '';
    return tr('prod.' + item.id, item.name || item.id);
  }
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toast-root').appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg || (window.CryptoMallI18n ? CryptoMallI18n.t('toast.copied') : '已复制')); }
    catch {
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); toast(okMsg || (window.CryptoMallI18n ? CryptoMallI18n.t('toast.copied') : '已复制'));
    }
  }
  function summaryText() {
    const sep = (window.CryptoMallI18n && CryptoMallI18n.lang === 'en') ? ', ' : '、';
    const names = inquireItems.map(i => pn(i) + (i.qty && i.qty > 1 ? ' ×' + i.qty : '')).join(sep);
    return [tr('inquire.summary_title'), tr('inquire.summary_biz') + names, tr('inquire.summary_ref')].join('\n');
  }
  async function resolveItems() {
    const params = new URLSearchParams(location.search);
    const qOrder = params.get('order');
    const qId = params.get('id');
    const pending = (window.CryptoMallPay && CryptoMallPay.loadPending()) || null;
    if (pending && pending.items && pending.items.length && pending.contactForPrice && (!qOrder || pending.orderId === qOrder)) {
      return pending.items;
    }
    if (!qId) return [];
    const catalog = await (await fetch('products.json?v=20261107v57')).json();
    const byId = Object.fromEntries((catalog.products || []).map(p => [p.id, p]));
    const cats = Object.fromEntries((catalog.categories || []).map(c => [c.id, c.name]));
    return qId.split(',').map(id => byId[id]).filter(Boolean).map(p => ({
      id: p.id,
      name: p.name,
      logo: p.logo,
      qty: 1,
      category: p.category,
      category_name: cats[p.category] || ''
    }));
  }
  function renderItems(items, catalog) {
    const cats = {};
    if (catalog && catalog.categories) {
      catalog.categories.forEach(c => { cats[c.id] = c.name; });
    }
    document.getElementById('inquire-items').innerHTML = items.map(i => {
      const raw = i.category_name || cats[i.category] || '';
      const meta = i.category ? tr('cat.' + i.category, raw) : raw;
      return `<div class="inquire-item-row">
        <span class="logo-circle"><img src="${esc(i.logo || 'assets/logo.jpg')}" alt="" onerror="this.src='assets/logo.jpg'" /></span>
        <div class="inquire-item-copy">
          <div class="inquire-item-name">${esc(pn(i))}</div>
          ${meta ? `<div class="inquire-item-meta">${esc(meta)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  (async function init() {
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('btn-footer-wechat').onclick = () => copyText(CONTACT_WECHAT, tr('toast.wechat'));
    let items = [];
    let catalog = null;
    try {
      items = await resolveItems();
      catalog = await (await fetch('products.json?v=20261107v57')).json();
    } catch (e) {}
    if (!items.length) {
      document.getElementById('empty').classList.remove('hidden');
      return;
    }
    inquireItems = items;
    renderItems(items, catalog);
    document.getElementById('content').classList.remove('hidden');
    document.getElementById('btn-copy-wx').onclick = () => copyText(CONTACT_WECHAT, tr('toast.wechat'));
    document.getElementById('btn-copy-summary').onclick = () => copyText(summaryText(), tr('toast.summary'));
    document.addEventListener('mall-langchange', function () {
      if (window.CryptoMallI18n) CryptoMallI18n.apply();
      if (inquireItems.length) renderItems(inquireItems, catalog);
    });
  })();
  </script>
