  <div id="toast-root"></div>
  <script src="assets/verify.js?v=20261107v57"></script>
  <script>
  function tr(key, vars) {
    return (window.CryptoMallI18n && CryptoMallI18n.t) ? CryptoMallI18n.t(key, vars) : (typeof vars === 'string' ? vars : key);
  }
  function pn(item) {
    if (!item) return '';
    return tr('prod.' + item.id, item.name || item.id);
  }
  function toast(msg){
    const el=document.createElement('div');
    el.className='toast';
    el.textContent=msg;
    document.getElementById('toast-root').appendChild(el);
    setTimeout(()=>el.remove(),2600);
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  const verified = CryptoMallPay.loadVerified();
  const params = new URLSearchParams(location.search);
  const qOrder = params.get('order');

  if (!verified || !verified.txHash || !verified.items || !verified.items.length ||
      (qOrder && verified.orderId !== qOrder)) {
    document.getElementById('gate').classList.remove('hidden');
  } else {
    const content = document.getElementById('content');
    content.classList.remove('hidden');
    content.style.display = 'flex';
    document.getElementById('oid').textContent = verified.orderId;
    document.getElementById('net').textContent = verified.network;
    document.getElementById('amt').textContent = verified.amountUsdt + ' USDT';
    const txEl = document.getElementById('tx');
    const short = verified.txHash.slice(0,10) + '…' + verified.txHash.slice(-8);
    txEl.textContent = short;
    txEl.href = verified.explorer || '#';
    document.getElementById('items').innerHTML = verified.items.map(i =>
      `<div style="display:flex;justify-content:space-between;gap:8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pn(i))}</span><span style="color:var(--price);font-size:12px">×${i.qty||1}</span></div>`
    ).join('');

    document.getElementById('btn-copy-wx').onclick = async () => {
      try { await navigator.clipboard.writeText('The666TH'); toast(tr('toast.wechat')); }
      catch { toast(tr('toast.wechat_manual')); }
    };

    document.getElementById('btn-copy-summary').onclick = async () => {
      const sep = (window.CryptoMallI18n && CryptoMallI18n.lang === 'en') ? ', ' : '、';
      const lines = [
        tr('contact.summary_title'),
        tr('contact.s_order') + verified.orderId,
        tr('contact.s_net') + verified.network,
        tr('contact.s_amt') + verified.amountUsdt + ' USDT',
        tr('contact.s_tx') + verified.txHash,
        tr('contact.s_biz') + verified.items.map(i => pn(i) + '×' + (i.qty||1)).join(sep),
      ];
      const text = lines.join('\n');
      try { await navigator.clipboard.writeText(text); toast(tr('toast.order_summary')); }
      catch {
        const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); toast(tr('toast.order_summary'));
      }
    };
  }
  document.addEventListener('mall-langchange', function () {
    if (window.CryptoMallI18n) CryptoMallI18n.apply();
  });
  </script>

  <script>
  document.getElementById('year').textContent = new Date().getFullYear();
  (function(){
    const btn=document.getElementById('btn-footer-wechat');
    if(!btn) return;
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText('The666TH'); } catch(e) {}
      const el=document.createElement('div'); el.className='toast'; el.textContent=tr('toast.wechat');
      (document.getElementById('toast-root')||document.body).appendChild(el);
      setTimeout(()=>el.remove(),2600);
    };
  })();
  </script>
