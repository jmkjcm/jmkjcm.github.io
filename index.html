  <script>
  function tr(key, vars) {
    return (window.CryptoMallI18n && CryptoMallI18n.t) ? CryptoMallI18n.t(key, vars) : (typeof vars === 'string' ? vars : key);
  }
  function pn(item) {
    if (!item) return '';
    return tr('prod.' + item.id, item.name || item.id);
  }
  const CART_KEY = 'crypto_mall_cart_v3';
  const CONTACT_TG = 'https://t.me/AJSAASJ';
  let CATALOG = { categories: [], products: [] };
  let cart = loadCart();
  let activeCategory = 'all';

  function loadCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch { return []; }
  }
  function saveCart() {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    updateCartUI();
  }
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toast-root').appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
  async function copyText(t, okMsg) {
    try { await navigator.clipboard.writeText(t); toast(okMsg || tr('toast.copied')); }
    catch {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); toast(okMsg || tr('toast.copied'));
    }
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function catName(id) {
    if (!id) return '';
    if (id === 'all') return tr('cat.all_items');
    const c = CATALOG.categories.find(x => x.id === id);
    return tr('cat.' + id, c ? c.name : id);
  }

  function isContactPrice(p) {
    if (!p) return false;
    if (p.contact_for_price === true || p.order_type === 'contact') return true;
    const v = p.price_usdt;
    return v === null || v === undefined || v === '?' || v === '';
  }
  function unitPrice(p) {
    if (isContactPrice(p)) return null;
    const n = Number(p.price_usdt);
    return Number.isFinite(n) ? n : null;
  }
  function formatPrice(p) {
    if (isContactPrice(p) || unitPrice(p) === null) return '888 USDT';
    return unitPrice(p) + ' USDT';
  }
  function formatPriceRaw(price, contact) {
    if (contact || price === null || price === undefined || price === '?' || price === '') return '888 USDT';
    const n = Number(price);
    if (!Number.isFinite(n)) return '888 USDT';
    return n + ' USDT';
  }

  function goPay(items) {
    if (!items.length) { toast(tr('toast.select')); return; }
    const mapped = items.map(i => {
      const contact = !!(i.contact_for_price || i.price_usdt === null || i.price_usdt === '?' || i.price_usdt === undefined || i.price_usdt === '');
      return {
        id: i.id,
        name: i.name,
        qty: i.qty || 1,
        price_usdt: contact ? null : Number(i.price_usdt),
        contact_for_price: contact,
        logo: i.logo || '',
        category: i.category || ''
      };
    });
    const hasContact = mapped.some(i => i.contact_for_price);
    const numericTotal = mapped.reduce((s, i) => {
      if (i.contact_for_price) return s;
      return s + (Number(i.price_usdt) || 0) * (i.qty || 1);
    }, 0);
    const order = {
      orderId: CryptoMallPay.makeOrderId(),
      createdAt: Date.now(),
      items: mapped,
      amountUsdt: hasContact && numericTotal === 0 ? null : numericTotal,
      contactForPrice: hasContact,
      amountDisplay: (hasContact && numericTotal === 0) ? '888 USDT' : (hasContact ? (numericTotal + ' + 888 USDT') : (numericTotal + ' USDT')),
    };
    CryptoMallPay.savePending(order);
    if (hasContact && numericTotal === 0) {
      const ids = mapped.map(i => i.id).filter(Boolean).join(',');
      location.href = 'inquire.html?order=' + encodeURIComponent(order.orderId) + (ids ? '&id=' + encodeURIComponent(ids) : '');
      return;
    }
    if (hasContact && numericTotal > 0) {
      const priced = mapped.filter(i => !i.contact_for_price);
      const payOrder = Object.assign({}, order, {
        items: priced,
        contactForPrice: false,
        amountUsdt: numericTotal,
        amountDisplay: numericTotal + ' USDT'
      });
      CryptoMallPay.savePending(payOrder);
      location.href = 'pay.html?order=' + encodeURIComponent(payOrder.orderId);
      return;
    }
    location.href = 'pay.html?order=' + encodeURIComponent(order.orderId);
  }

  function buyOne(id) {
    const p = CATALOG.products.find(x => x.id === id);
    if (!p) return;
    goPay([{
      id: p.id,
      name: p.name,
      qty: 1,
      logo: p.logo,
      price_usdt: isContactPrice(p) ? null : unitPrice(p),
      contact_for_price: isContactPrice(p),
      category: p.category || ''
    }]);
  }

  function addToCart(id) {
    const p = CATALOG.products.find(x => x.id === id);
    if (!p) return;
    if (isContactPrice(p)) {
      toast(tr('toast.need_inquire'));
      return;
    }
    const price = unitPrice(p);
    const exist = cart.find(x => x.id === id);
    if (exist) exist.qty += 1;
    else cart.push({ id: p.id, name: p.name, price_usdt: price, contact_for_price: false, logo: p.logo, qty: 1 });
    saveCart();
    toast(tr('toast.added'));
  }

  const HOT_CATS = [
    { id: 'avatar', name: '头像信息收录' },
    { id: 'listing_spot', name: '交易所上线' },
    { id: 'listing_spot_futures', name: '上合约' },
    { id: 'alpha', name: 'Alpha' }
  ];
  function categoryList() {
    const cats = [...CATALOG.categories].sort((a,b)=>a.order-b.order).map(c => ({
      id: c.id,
      name: tr('cat.' + c.id, c.name)
    }));
    return [{ id: 'all', name: tr('cat.all_items') }, ...cats];
  }
  function currentCategoryName() {
    const hot = HOT_CATS.find(x => x.id === activeCategory);
    if (hot) return tr('hotcat.' + hot.id, hot.name);
    const hit = categoryList().find(x => x.id === activeCategory);
    return hit ? hit.name : tr('cat.all_items');
  }
  function renderTabs() {
    const tabs = categoryList();
    document.getElementById('category-tabs').innerHTML = tabs.map(t => `
      <button type="button" data-cat="${t.id}" role="tab" aria-selected="${activeCategory===t.id}"
        class="pill${activeCategory===t.id?' active':''}">${escapeHtml(t.name)}</button>`).join('');
    const cur = document.getElementById('category-current');
    if (cur) cur.textContent = currentCategoryName();
    const list = document.getElementById('category-sheet-list');
    if (list) {
      list.innerHTML = tabs.map(t => `
        <button type="button" role="option" data-cat-pick="${t.id}" aria-selected="${activeCategory===t.id}"
          class="cat-sheet-item${activeCategory===t.id?' active':''}">${escapeHtml(t.name)}</button>`).join('');
    }
    const hotList = document.getElementById('hot-cats-list');
    if (hotList) {
      hotList.innerHTML = HOT_CATS.map(c => `
        <button type="button" data-hot-cat="${c.id}" class="hot-cat${activeCategory===c.id?' active':''}">${escapeHtml(tr('hotcat.' + c.id, c.name))}</button>
      `).join('');
    }
  }
  function openCategorySheet() {
    document.getElementById('category-overlay').classList.add('open');
    const sheet = document.getElementById('category-sheet');
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.getElementById('category-trigger').setAttribute('aria-expanded', 'true');
    document.body.classList.add('cat-sheet-open');
  }
  function closeCategorySheet() {
    document.getElementById('category-overlay').classList.remove('open');
    const sheet = document.getElementById('category-sheet');
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.getElementById('category-trigger').setAttribute('aria-expanded', 'false');
    document.body.classList.remove('cat-sheet-open');
  }

  function productRowHtml(p, compact) {
    const priceLabel = formatPrice(p);
    const buyLabel = isContactPrice(p) ? tr('btn.inquire') : tr('btn.buy');
    if (compact) {
      return `
      <article class="hot-card">
        <div class="hot-card-top">
          <span class="logo-circle">
            <img src="${escapeHtml(p.logo || 'assets/logo.jpg')}" alt="" loading="eager" decoding="async" fetchpriority="high" onerror="this.src='assets/logo.jpg'" />
          </span>
          <div class="hot-card-info">
            <div class="row-name">
              <span class="name">${escapeHtml(pn(p))}</span>
            </div>
            <div class="row-meta">${escapeHtml(catName(p.category))}${p.speed ? ' · ' + escapeHtml(p.speed) : ''}</div>
          </div>
        </div>
        <div class="hot-card-bottom">
          <div class="price">${priceLabel}</div>
          <div class="action-btns">
            <button type="button" data-buy="${p.id}" class="btn btn-primary btn-xs btn-buy" aria-label="${buyLabel}">${buyLabel}</button>
          </div>
        </div>
      </article>`;
    }
    return `
      <article class="product-row">
        <span class="logo-circle">
          <img src="${escapeHtml(p.logo || 'assets/logo.jpg')}" alt="" loading="eager" decoding="async" fetchpriority="high" onerror="this.src='assets/logo.jpg'" />
        </span>
        <div class="row-main">
          <div class="row-name">
            <span class="name">${escapeHtml(pn(p))}</span>
            ${p.hot ? '<span class="hot-tag">' + escapeHtml(tr('tag.hot')) + '</span>' : ''}
          </div>
          <div class="row-meta">${escapeHtml(catName(p.category))}${p.speed ? ' · ' + escapeHtml(p.speed) : ''}</div>
        </div>
        <div class="row-actions">
          <div class="price">${priceLabel}</div>
          <div class="action-btns">
            <button type="button" data-cart="${p.id}" class="btn btn-ghost btn-xs btn-add" aria-label="${escapeHtml(tr('btn.add_aria'))}">${escapeHtml(tr('btn.add'))}</button>
            <button type="button" data-buy="${p.id}" class="btn btn-primary btn-xs btn-buy" aria-label="${buyLabel}">${buyLabel}</button>
          </div>
        </div>
      </article>`;
  }

  function updateMeta(visibleCount) {
    const meta = document.getElementById('meta-label');
    if (!meta) return;
    const suffix = tr('meta.suffix');
    if (activeCategory === 'all') {
      meta.innerHTML = escapeHtml(tr('meta.all', { n: CATALOG.products.length, suffix })).replace(String(CATALOG.products.length), `<span id="product-count">${CATALOG.products.length}</span>`);
      return;
    }
    const label = tr('meta.cat', { name: currentCategoryName(), n: visibleCount, suffix });
    meta.innerHTML = escapeHtml(label).replace(String(visibleCount), `<span id="product-count">${visibleCount}</span>`);
  }
  function categoryCloseHtml(count) {
    if (count >= 6) return '';
    return `<div class="cat-close">
      <p>${escapeHtml(tr('close.note', { n: count }))}</p>
      <a href="${CONTACT_TG}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-xs">${escapeHtml(tr('close.cta'))}</a>
    </div>`;
  }
  function renderProducts() {
    const grid = document.getElementById('product-grid');
    const all = CATALOG.products;
    if (activeCategory === 'all') {
      const hot = all.filter(p => p.hot);
      const rest = all.filter(p => !p.hot);
      document.getElementById('empty-hint').classList.toggle('hidden', all.length > 0);
      const hotBlock = hot.length ? `
        <section class="hot-section" aria-label="${escapeHtml(tr('section.hot'))}">
          <div class="section-title">${escapeHtml(tr('section.hot'))}</div>
          <div class="hot-grid">${hot.map(p => productRowHtml(p, true)).join('')}</div>
        </section>` : '';
      const restBlock = rest.length ? `
        <section class="rest-section" aria-label="${escapeHtml(tr('section.all'))}">
          <div class="section-title section-title-muted">${escapeHtml(tr('section.more'))}</div>
          <div class="product-list">${rest.map(p => productRowHtml(p, false)).join('')}</div>
        </section>` : '';
      grid.className = 'catalog-view';
      grid.innerHTML = hotBlock + restBlock;
      document.body.classList.remove('page-short');
      updateMeta(all.length);
      return;
    }
    const list = all.filter(p => p.category === activeCategory);
    document.getElementById('empty-hint').classList.toggle('hidden', list.length > 0);
    grid.className = 'product-list';
    grid.innerHTML = list.map(p => productRowHtml(p, false)).join('') + categoryCloseHtml(list.length);
    document.body.classList.toggle('page-short', list.length < 6);
    updateMeta(list.length);
  }

  function updateCartUI() {
    const badge = document.getElementById('cart-badge');
    const count = cart.reduce((s,i)=>s+i.qty,0);
    if (count > 0) { badge.textContent = count > 99 ? '99+' : String(count); badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
    const wrap = document.getElementById('cart-items');
    if (!cart.length) {
      wrap.innerHTML = '<div class="empty-state" style="padding:48px 12px">' + tr('empty.cart') + '<br><span style="font-size:12px;opacity:.7">' + tr('empty.cart_hint') + '</span></div>';
    } else {
      wrap.innerHTML = cart.map(i => `
        <div class="cart-item">
          <span class="logo-circle" style="width:40px;height:40px"><img src="${escapeHtml(i.logo||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'" /></span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(pn(i))}</div>
            <div style="font-size:12px;color:var(--price);margin-top:2px">${formatPriceRaw(i.price_usdt, i.contact_for_price)} × ${i.qty}</div>
          </div>
          <div class="qty-ctrl">
            <button type="button" data-qty="${i.id}" data-d="-1" class="qty-btn" aria-label="${escapeHtml(tr('cart.minus'))}">−</button>
            <span style="width:20px;text-align:center;font-size:13px">${i.qty}</span>
            <button type="button" data-qty="${i.id}" data-d="1" class="qty-btn" aria-label="${escapeHtml(tr('cart.plus'))}">+</button>
          </div>
        </div>`).join('');
    }
    const sum = cart.reduce((s,i)=>{
      if (i.contact_for_price || i.price_usdt === null || i.price_usdt === undefined) return s;
      return s + (Number(i.price_usdt)||0) * i.qty;
    }, 0);
    const hasQ = cart.some(i => i.contact_for_price || i.price_usdt === null || i.price_usdt === undefined);
    let totalLabel;
    if (!cart.length) totalLabel = '0 USDT';
    else if (hasQ && sum === 0) totalLabel = '888 USDT';
    else if (hasQ) totalLabel = sum + ' + 888 USDT';
    else totalLabel = sum + ' USDT';
    document.getElementById('cart-total').textContent = totalLabel;
  }

  function openCart() {
    document.getElementById('cart-drawer').classList.add('open');
    document.getElementById('cart-overlay').classList.add('open');
  }
  function closeCart() {
    document.getElementById('cart-drawer').classList.remove('open');
    document.getElementById('cart-overlay').classList.remove('open');
  }

  async function init() {
    document.getElementById('year').textContent = new Date().getFullYear();
    CATALOG = await (await fetch('products.json?v=20261107v57')).json();
    renderTabs();
    renderProducts();
    updateCartUI();

    document.getElementById('category-tabs').addEventListener('click', e => {
      const btn = e.target.closest('[data-cat]');
      if (!btn) return;
      activeCategory = btn.dataset.cat;
      renderTabs(); renderProducts();
    });
    document.getElementById('category-trigger').addEventListener('click', openCategorySheet);
    document.getElementById('category-overlay').addEventListener('click', closeCategorySheet);
    document.getElementById('category-sheet-close').addEventListener('click', closeCategorySheet);
    document.getElementById('category-sheet-list').addEventListener('click', e => {
      const btn = e.target.closest('[data-cat-pick]');
      if (!btn) return;
      activeCategory = btn.dataset.catPick;
      renderTabs();
      renderProducts();
      closeCategorySheet();
    });
    document.getElementById('hot-cats-list').addEventListener('click', e => {
      const btn = e.target.closest('[data-hot-cat]');
      if (!btn) return;
      activeCategory = btn.dataset.hotCat;
      renderTabs();
      renderProducts();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeCategorySheet();
    });
    document.getElementById('product-grid').addEventListener('click', e => {
      const buy = e.target.closest('[data-buy]');
      if (buy) { buyOne(buy.dataset.buy); return; }
      const add = e.target.closest('[data-cart]');
      if (add) addToCart(add.dataset.cart);
    });
    document.getElementById('cart-items').addEventListener('click', e => {
      const q = e.target.closest('[data-qty]');
      if (!q) return;
      const item = cart.find(x => x.id === q.dataset.qty);
      if (!item) return;
      item.qty += Number(q.dataset.d);
      if (item.qty <= 0) cart = cart.filter(x => x.id !== item.id);
      saveCart();
    });
    document.getElementById('btn-cart').onclick = openCart;
    document.getElementById('btn-close-cart').onclick = closeCart;
    document.getElementById('cart-overlay').onclick = closeCart;
    document.getElementById('btn-clear-cart').onclick = () => { cart = []; saveCart(); toast(tr('toast.cleared')); };
    document.getElementById('btn-checkout').onclick = () => {
      if (!cart.length) { toast(tr('toast.cart_empty')); return; }
      goPay(cart);
    };
    document.getElementById('btn-footer-wechat').onclick = () => copyText('The666TH', tr('toast.wechat'));
    setupHotCatsCollapse();
  }
  function setupHotCatsCollapse() {
    const bar = document.querySelector('.tabs-bar');
    if (!bar) return;
    const sync = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      bar.classList.toggle('is-collapsed', y > 8);
    };
    window.addEventListener('scroll', sync, { passive: true });
    sync();
  }
  document.addEventListener('mall-langchange', function () {
    if (CATALOG && CATALOG.products) {
      renderTabs();
      renderProducts();
      updateCartUI();
    }
    if (window.CryptoMallI18n) CryptoMallI18n.apply();
  });
  init().catch(() => toast(tr('toast.catalog_fail')));

  </script>
</body>
</html>
